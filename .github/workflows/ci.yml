name: Source validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            outputs/avalokita/app/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13.17
      - run: python scripts/release_guard.py --mode validate
      - run: python scripts/verify_reason_source.py
      - run: python scripts/verify_module_payload.py
      - run: npm ci
      - run: npm --prefix outputs/avalokita/app ci
      - run: npm run test:packaging
      - run: npm run test:desktop
      - run: python -m compileall -q outputs/avalokita outputs/sharebus scripts
      - run: npm run build
      - run: python scripts/verify_ui_payload.py
      # Native provider/model tests require separate bounded human-root receipts.
      # This workflow never logs in, starts a native session, or submits a prompt.
