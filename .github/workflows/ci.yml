name: Standalone source and wheel

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check source pins, license provenance and private-data patterns
        run: python tools/check_release.py
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Standalone units, including synthetic foreign-namespace import checks
        run: >-
          python -m pytest outputs/sharebus/tests tests
          --deselect=outputs/sharebus/tests/test_sidecar_registry.py::test_development_and_public_allowlists_include_shared_module
          --deselect=outputs/sharebus/tests/test_sidecar_registry.py::test_public_packaging_filters_support_isolated_import_and_enable
      - name: Build source distribution and wheel
        run: python -m build
      - name: Prepare a local dependency wheelhouse
        run: python -m pip wheel --wheel-dir .wheelhouse .
      - name: Offline installed CLI, resources and MCP protocol smoke
        run: python tools/smoke_wheel.py --wheelhouse .wheelhouse --work-dir build/installed-wheel-smoke
